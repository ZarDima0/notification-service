services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: notification_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      - postgres
      - rabbitmq
      - redis

  nginx:
    image: nginx:latest
    container_name: notification_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: notification_worker
    working_dir: /var/www
    command: php artisan queue:work rabbitmq --queue=high,low --tries=5
    volumes:
      - ./backend:/var/www
    depends_on:
      - app
      - rabbitmq
      - redis
  postgres:
    image: postgres:16
    container_name: notification_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  rabbitmq:
    image: rabbitmq:3-management
    container_name: notification_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
  redis:
    image: redis:7
    container_name: notification_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  postgres_data: